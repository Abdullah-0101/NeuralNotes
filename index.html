<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alsalem Neural-Notes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Outfit', 'sans-serif'] },
                    colors: {
                        surface: '#0f1419',
                        card: '#1a2332',
                        accent: '#22d3ee',
                        accentDim: '#0891b2',
                        correct: '#34d399',
                        wrong: '#f87171',
                        muted: '#64748b'
                    }
                }
            }
        }
    </script>
    <style>
        * { font-family: 'Outfit', sans-serif; }
        body { background: linear-gradient(135deg, #0f1419 0%, #1a1f2e 50%, #0f172a 100%); min-height: 100vh; }

        .card-option { transition: all 0.2s ease; }
        .card-option:hover:not(.disabled) { background: rgba(34, 211, 238, 0.15); border-color: #22d3ee; transform: translateX(4px); }
        .card-option.correct { background: rgba(52, 211, 153, 0.2) !important; border-color: #34d399 !important; color: #34d399 !important; }
        .card-option.wrong { background: rgba(248, 113, 113, 0.2) !important; border-color: #f87171 !important; color: #f87171 !important; pointer-events: none; }
        .card-option.disabled { opacity: 0.6; pointer-events: none; }

        .qcard {
            background: linear-gradient(180deg, #1a2332 0%, #151d2b 100%);
            border: 1px solid rgba(255,255,255,0.06);
            box-shadow: 0 4px 24px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.04);
        }
        .qcard:hover { border-color: rgba(34, 211, 238, 0.3); box-shadow: 0 8px 32px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.06); }

        .pill-btn { color: #64748b; transition: all 0.2s; }
        .pill-btn.active { background: linear-gradient(135deg, #22d3ee, #0891b2); color: #0f1419; }
        .pill-btn:not(.active):hover { color: #e2e8f0; }

        .btn-primary { background: linear-gradient(135deg, #22d3ee, #0891b2); }
        .btn-primary:hover:not(:disabled) { filter: brightness(1.15); transform: translateY(-1px); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-secondary {
            background: rgba(34, 211, 238, 0.1); border: 1px solid rgba(34, 211, 238, 0.25); color: #22d3ee;
        }
        .btn-secondary:hover:not(:disabled) { background: rgba(34, 211, 238, 0.2); border-color: #22d3ee; }
        .btn-secondary:disabled { opacity: 0.5; cursor: not-allowed; }

        .shimmer { animation: shimmer 2s infinite linear; background: linear-gradient(90deg, #22d3ee20 0%, #22d3ee40 50%, #22d3ee20 100%); background-size: 200% 100%; }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

        .rtl { direction: rtl; text-align: right; }
        .rtl .card-option:hover:not(.disabled) { transform: translateX(-4px); }

        .flip-card { perspective: 1200px; }
        .flip-inner { position: relative; width: 100%; min-height: 240px; transition: transform 0.7s cubic-bezier(0.4, 0.0, 0.2, 1); transform-style: preserve-3d; }
        .flip-card.flipped .flip-inner { transform: rotateY(180deg); }
        .flip-face {
            position: absolute; inset: 0; backface-visibility: hidden;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 32px 28px; border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.06);
        }
        .flip-front-face {
            background: linear-gradient(180deg, #1e293b 0%, #1a2332 100%);
            border: 1px solid rgba(255,255,255,0.08);
        }
        .flip-back-face {
            transform: rotateY(180deg);
            background: linear-gradient(135deg, #0891b2, #22d3ee);
            color: #0f1419;
            border: 1px solid rgba(255,255,255,0.15);
        }
        .flip-btn {
            background: rgba(34, 211, 238, 0.15); border: 1px solid rgba(34, 211, 238, 0.3);
            color: #22d3ee; transition: all 0.2s;
        }
        .flip-btn:hover { background: rgba(34, 211, 238, 0.25); transform: scale(1.05); }
        .flip-card.flipped .flip-btn-back { background: rgba(0,0,0,0.15); border-color: rgba(0,0,0,0.2); color: #0f1419; }
        .flip-card.flipped .flip-btn-back:hover { background: rgba(0,0,0,0.25); }

        .speak-btn {
            background: none; border: none; cursor: pointer; padding: 4px;
            color: #64748b; transition: color 0.2s, transform 0.2s;
        }
        .speak-btn:hover { color: #22d3ee; transform: scale(1.15); }
        .speak-btn.speaking { color: #22d3ee; animation: pulse 1s infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }

        .export-menu { display: none; }
        .export-menu.show { display: block; }

        .mindmap-container { overflow-x: auto; }
        .mm-node {
            background: linear-gradient(135deg, #1a2332, #151d2b);
            border: 1px solid rgba(34, 211, 238, 0.3);
            border-radius: 12px; padding: 10px 18px;
            color: #e2e8f0; font-size: 14px; font-weight: 500;
            white-space: nowrap; display: inline-block;
            box-shadow: 0 2px 12px rgba(0,0,0,0.3);
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .mm-node:hover { border-color: #22d3ee; box-shadow: 0 4px 20px rgba(34,211,238,0.15); }
        .mm-root { background: linear-gradient(135deg, #22d3ee, #0891b2); color: #0f1419; font-weight: 700; font-size: 16px; border-color: transparent; }
        .mm-root:hover { border-color: rgba(255,255,255,0.3); }
        .mm-branch { border-left: 2px solid rgba(34, 211, 238, 0.2); margin-left: 20px; padding-left: 20px; }
        .mm-connector { width: 20px; height: 1px; background: rgba(34,211,238,0.3); display: inline-block; vertical-align: middle; margin-right: 8px; }
    </style>
</head>
<body class="text-slate-100 antialiased">
    <div class="max-w-3xl mx-auto px-6 py-12">

        <header class="text-center mb-12">
            <h1 class="text-4xl font-bold tracking-tight bg-gradient-to-r from-cyan-300 to-teal-400 bg-clip-text text-transparent">
                Alsalem Neural-Notes
            </h1>
            <p class="text-slate-400 mt-2">Paste your notes. Get MCQs. Test yourself.</p>
        </header>

        <section class="mb-12">
            <div class="relative">
                <textarea
                    id="notes"
                    rows="5"
                    class="w-full bg-card/80 border border-white/10 rounded-2xl p-5 pr-14 text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-accent/50 focus:border-accent/50 resize-none transition"
                    placeholder="Paste your study notes here...&#10;&#10;Example: The mitochondria is the powerhouse of the cell. It produces ATP through cellular respiration."
                ></textarea>
                <label
                    for="image-upload"
                    class="absolute top-4 right-4 cursor-pointer p-2 rounded-xl bg-white/5 border border-white/10 hover:border-accent/50 hover:bg-accent/10 transition group"
                    title="Upload an image"
                >
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-slate-400 group-hover:text-accent transition" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3 7h2l2-3h10l2 3h2a1 1 0 011 1v11a1 1 0 01-1 1H3a1 1 0 01-1-1V8a1 1 0 011-1z"/>
                        <circle cx="12" cy="13" r="4"/>
                    </svg>
                </label>
                <input type="file" id="image-upload" accept="image/*" class="hidden" onchange="handleImageUpload(event)">
            </div>
            <div id="image-preview" class="hidden mt-3 flex items-center gap-3">
                <img id="preview-thumb" class="h-12 w-12 rounded-lg object-cover border border-white/10" alt="preview">
                <span class="text-slate-400 text-sm" id="preview-name"></span>
                <button onclick="clearImage()" class="text-wrong text-sm hover:underline">Remove</button>
            </div>

            <div class="flex flex-wrap items-center gap-3 mt-5">
                <div class="flex items-center bg-card/80 border border-white/10 rounded-2xl p-1 shrink-0">
                    <button id="lang-en" onclick="setLanguage('English')" class="pill-btn px-4 py-2.5 rounded-xl text-sm font-semibold active">English</button>
                    <button id="lang-ar" onclick="setLanguage('Arabic')" class="pill-btn px-4 py-2.5 rounded-xl text-sm font-semibold">العربية</button>
                </div>
                <div class="flex items-center bg-card/80 border border-white/10 rounded-2xl p-1 shrink-0">
                    <button id="mode-mcq" onclick="setMode('mcq')" class="pill-btn px-4 py-2.5 rounded-xl text-sm font-semibold active">MCQ</button>
                    <button id="mode-study" onclick="setMode('study')" class="pill-btn px-4 py-2.5 rounded-xl text-sm font-semibold">Study</button>
                </div>
            </div>

            <div class="flex flex-wrap gap-3 mt-4">
                <button onclick="generateCards()" id="btn"
                    class="btn-primary flex-1 min-w-[140px] py-3.5 rounded-2xl font-semibold text-slate-900 shadow-lg shadow-cyan-500/25 transition">
                    Generate Flashcards
                </button>
                <button onclick="generateMindMap()" id="btn-mindmap"
                    class="btn-secondary flex-1 min-w-[140px] py-3.5 rounded-2xl font-semibold transition">
                    Mind Map
                </button>
            </div>
        </section>

        <div id="loading" class="hidden mb-12 text-center py-12 rounded-2xl qcard">
            <div class="shimmer rounded-xl h-3 w-48 mx-auto mb-4"></div>
            <p class="text-slate-400" id="loading-text">AI is generating your quiz...</p>
        </div>

        <div id="export-bar" class="hidden mb-6 flex justify-end relative">
            <button onclick="toggleExportMenu()" class="flex items-center gap-2 px-5 py-2.5 rounded-xl bg-card border border-white/10 text-slate-300 hover:border-accent/40 hover:text-accent transition text-sm font-medium">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2M7 10l5 5m0 0l5-5m-5 5V3"/></svg>
                Export
            </button>
            <div id="export-menu" class="export-menu absolute right-0 top-12 bg-card border border-white/10 rounded-xl shadow-2xl z-50 overflow-hidden">
                <button onclick="exportPDF()" class="w-full px-6 py-3 text-left text-sm text-slate-300 hover:bg-accent/10 hover:text-accent transition">PDF Document</button>
                <button onclick="exportCSV()" class="w-full px-6 py-3 text-left text-sm text-slate-300 hover:bg-accent/10 hover:text-accent transition border-t border-white/5">Anki CSV</button>
            </div>
        </div>

        <div id="cards-container" class="space-y-8"></div>

        <div id="mindmap-section" class="hidden mt-8 fade-in">
            <h2 class="text-xl font-bold text-slate-200 mb-6 flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-accent" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
                AI Mind Map
            </h2>
            <div id="mindmap-render" class="mindmap-container qcard rounded-2xl p-8 overflow-x-auto"></div>
        </div>

        <footer class="mt-16 text-center text-slate-500 text-sm pb-8">
            Developed by Abdullah Nawaf Alsalem
        </footer>
    </div>

    <script>
        let mcqCards = [];
        let selectedLanguage = 'English';
        let selectedMode = 'mcq';
        let uploadedImageBase64 = null;
        let currentUtterance = null;

        const API_BASE = 'https://neuralnotes.onrender.com';

        function setLanguage(lang) {
            selectedLanguage = lang;
            document.getElementById('lang-en').classList.toggle('active', lang === 'English');
            document.getElementById('lang-ar').classList.toggle('active', lang === 'Arabic');
        }

        function setMode(mode) {
            selectedMode = mode;
            document.getElementById('mode-mcq').classList.toggle('active', mode === 'mcq');
            document.getElementById('mode-study').classList.toggle('active', mode === 'study');
        }

        function handleImageUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () => {
                uploadedImageBase64 = reader.result;
                document.getElementById('preview-thumb').src = reader.result;
                document.getElementById('preview-name').textContent = file.name;
                document.getElementById('image-preview').classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        }

        function clearImage() {
            uploadedImageBase64 = null;
            document.getElementById('image-upload').value = '';
            document.getElementById('image-preview').classList.add('hidden');
        }

        function toggleExportMenu() {
            document.getElementById('export-menu').classList.toggle('show');
        }

        document.addEventListener('click', (e) => {
            if (!e.target.closest('#export-bar')) {
                document.getElementById('export-menu').classList.remove('show');
            }
        });

        /* ─── Read Aloud (Web Speech API) ─── */

        function speakText(text, btnEl) {
            if (!('speechSynthesis' in window)) {
                alert('Your browser does not support text-to-speech.');
                return;
            }
            if (currentUtterance && speechSynthesis.speaking) {
                speechSynthesis.cancel();
                document.querySelectorAll('.speak-btn.speaking').forEach(b => b.classList.remove('speaking'));
                currentUtterance = null;
                return;
            }

            const utterance = new SpeechSynthesisUtterance(text);
            const isArabicText = /[\u0600-\u06FF]/.test(text);
            utterance.lang = isArabicText ? 'ar-SA' : 'en-US';
            utterance.rate = 0.95;

            const voices = speechSynthesis.getVoices();
            const preferred = voices.find(v => v.lang.startsWith(isArabicText ? 'ar' : 'en'));
            if (preferred) utterance.voice = preferred;

            if (btnEl) btnEl.classList.add('speaking');
            utterance.onend = () => {
                if (btnEl) btnEl.classList.remove('speaking');
                currentUtterance = null;
            };
            utterance.onerror = () => {
                if (btnEl) btnEl.classList.remove('speaking');
                currentUtterance = null;
            };

            currentUtterance = utterance;
            speechSynthesis.speak(utterance);
        }

        if ('speechSynthesis' in window) {
            speechSynthesis.getVoices();
            speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
        }

        function speakerSVG() {
            return `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 010 7.07"/><path d="M19.07 4.93a10 10 0 010 14.14"/></svg>`;
        }

        /* ─── Generate Flashcards ─── */

        async function generateCards() {
            const text = document.getElementById('notes').value.trim();
            const btn = document.getElementById('btn');
            const loading = document.getElementById('loading');
            const container = document.getElementById('cards-container');

            if (!text && !uploadedImageBase64) {
                alert("Please paste some notes or upload an image first!");
                return;
            }

            btn.disabled = true;
            document.getElementById('btn-mindmap').disabled = true;
            document.getElementById('loading-text').textContent = 'AI is generating your quiz...';
            loading.classList.remove('hidden');
            container.innerHTML = '';
            document.getElementById('export-bar').classList.add('hidden');
            document.getElementById('mindmap-section').classList.add('hidden');

            try {
                const payload = { text: text || "(See attached image)", language: selectedLanguage, mode: selectedMode };
                if (uploadedImageBase64) payload.image = uploadedImageBase64;

                const response = await fetch(`${API_BASE}/generate`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.detail || "API error");

                mcqCards = Array.isArray(data) ? data : [];
                renderCards();
                if (mcqCards.length) document.getElementById('export-bar').classList.remove('hidden');
            } catch (err) {
                const msg = (err.message && err.message.includes("fetch"))
                    ? "Could not connect to the AI engine. Make sure main.py is running!"
                    : (err.message || "An error occurred.");
                alert(msg);
            } finally {
                btn.disabled = false;
                document.getElementById('btn-mindmap').disabled = false;
                loading.classList.add('hidden');
            }
        }

        function renderCards() {
            const container = document.getElementById('cards-container');
            container.innerHTML = '';
            const isArabic = selectedLanguage === 'Arabic';
            if (selectedMode === 'study') renderStudyCards(container, isArabic);
            else renderMCQCards(container, isArabic);
        }

        function renderStudyCards(container, isArabic) {
            mcqCards.forEach((card, idx) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'flip-card fade-in' + (isArabic ? ' rtl' : '');
                wrapper.id = `study-card-${idx}`;
                const answer = card.answer || card.correctAnswer || '';
                wrapper.innerHTML = `
                    <div class="flip-inner">
                        <div class="flip-face flip-front-face">
                            <div class="flex items-center gap-2 mb-4">
                                <span class="bg-accent/20 text-accent text-xs font-medium px-3 py-1 rounded-full">Q${idx + 1}</span>
                                <button class="speak-btn" onclick="event.stopPropagation(); speakText('${escapeJS(card.question)}', this)" title="Read aloud">${speakerSVG()}</button>
                            </div>
                            <p class="text-lg font-medium text-slate-200 leading-relaxed text-center mb-6">${escapeHtml(card.question)}</p>
                            <button onclick="flipCard(${idx})" class="flip-btn px-6 py-2 rounded-full text-sm font-semibold">Flip to Answer</button>
                        </div>
                        <div class="flip-face flip-back-face">
                            <div class="flex items-center gap-2 mb-3">
                                <span class="text-xs font-bold opacity-60 uppercase tracking-wider">Answer</span>
                                <button class="speak-btn" style="color:#0f1419" onclick="event.stopPropagation(); speakText('${escapeJS(answer)}', this)" title="Read aloud">${speakerSVG()}</button>
                            </div>
                            <p class="text-base font-semibold leading-relaxed text-center mb-6">${escapeHtml(answer)}</p>
                            <button onclick="flipCard(${idx})" class="flip-btn flip-btn-back px-6 py-2 rounded-full text-sm font-semibold">Back to Question</button>
                        </div>
                    </div>
                `;
                container.appendChild(wrapper);
            });
        }

        function flipCard(idx) {
            document.getElementById(`study-card-${idx}`).classList.toggle('flipped');
        }

        function renderMCQCards(container, isArabic) {
            mcqCards.forEach((card, idx) => {
                const el = document.createElement('div');
                el.className = 'qcard rounded-2xl p-8 fade-in' + (isArabic ? ' rtl' : '');
                el.innerHTML = `
                    <div class="flex items-center gap-2 mb-6">
                        <span class="bg-accent/20 text-accent text-sm font-medium px-3 py-1 rounded-full">Q${idx + 1}</span>
                        <button class="speak-btn" onclick="speakText('${escapeJS(card.question)}', this)" title="Read aloud">${speakerSVG()}</button>
                    </div>
                    <p class="text-lg font-medium text-slate-200 mb-6 leading-relaxed">${escapeHtml(card.question)}</p>
                    <div class="space-y-3" id="options-${idx}"></div>
                    <div id="feedback-${idx}" class="mt-4 hidden"></div>
                `;
                const optionsContainer = el.querySelector(`#options-${idx}`);
                (card.options || []).forEach((opt) => {
                    const btn = document.createElement('button');
                    btn.className = 'card-option w-full text-left p-4 rounded-xl border border-white/10 bg-white/5 text-slate-300';
                    btn.textContent = opt;
                    btn.dataset.option = opt;
                    btn.onclick = () => selectOption(idx, opt);
                    optionsContainer.appendChild(btn);
                });
                container.appendChild(el);
            });
        }

        function selectOption(cardIdx, selectedOption) {
            const card = mcqCards[cardIdx];
            const correctAnswer = (card.correctAnswer || card.correct_answer || '').trim();
            const optionsContainer = document.getElementById(`options-${cardIdx}`);
            const feedbackDiv = document.getElementById(`feedback-${cardIdx}`);
            if (!optionsContainer || !card || !feedbackDiv) return;

            const buttons = optionsContainer.querySelectorAll('button');
            const isCorrect = String(selectedOption).trim() === correctAnswer;
            const matchCorrect = (opt) => String(opt || '').trim() === correctAnswer;

            if (isCorrect) {
                buttons.forEach(btn => {
                    btn.classList.add('disabled');
                    if (matchCorrect(btn.dataset.option)) btn.classList.add('correct');
                });
                feedbackDiv.classList.remove('hidden');
                feedbackDiv.innerHTML = '<span class="text-correct font-medium">✓ Correct!</span>';
            } else {
                const selectedBtn = Array.from(buttons).find(b => b.dataset.option === selectedOption);
                if (selectedBtn) { selectedBtn.classList.add('wrong'); selectedBtn.classList.add('disabled'); }
                feedbackDiv.classList.remove('hidden');
                const wrongCount = optionsContainer.querySelectorAll('.wrong').length;
                if (wrongCount >= (card.options || []).length - 1) {
                    buttons.forEach(btn => {
                        btn.classList.add('disabled');
                        if (matchCorrect(btn.dataset.option)) btn.classList.add('correct');
                    });
                    feedbackDiv.innerHTML = `<span class="text-wrong">Incorrect.</span> <span class="text-slate-400">Correct answer: </span><span class="text-correct">${escapeHtml(correctAnswer)}</span>`;
                } else {
                    feedbackDiv.innerHTML = '<span class="text-wrong font-medium">Incorrect. Try another answer!</span>';
                }
            }
        }

        /* ─── Mind Map ─── */

        async function generateMindMap() {
            const text = document.getElementById('notes').value.trim();
            if (!text) { alert("Please paste some notes first!"); return; }

            const btn = document.getElementById('btn-mindmap');
            const loading = document.getElementById('loading');
            btn.disabled = true;
            document.getElementById('btn').disabled = true;
            document.getElementById('loading-text').textContent = 'AI is building your mind map...';
            loading.classList.remove('hidden');
            document.getElementById('mindmap-section').classList.add('hidden');

            try {
                const response = await fetch(`${API_BASE}/generate-mindmap`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text, language: selectedLanguage })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.detail || "API error");

                renderMindMap(data);
                document.getElementById('mindmap-section').classList.remove('hidden');
            } catch (err) {
                const msg = (err.message && err.message.includes("fetch"))
                    ? "Could not connect to the AI engine."
                    : (err.message || "An error occurred.");
                alert(msg);
            } finally {
                btn.disabled = false;
                document.getElementById('btn').disabled = false;
                loading.classList.add('hidden');
            }
        }

        function renderMindMap(node) {
            const container = document.getElementById('mindmap-render');
            const isArabic = selectedLanguage === 'Arabic';
            container.className = 'mindmap-container qcard rounded-2xl p-8 overflow-x-auto' + (isArabic ? ' rtl' : '');
            container.innerHTML = buildTreeHTML(node, true);
        }

        function buildTreeHTML(node, isRoot) {
            if (!node) return '';
            const label = escapeHtml(node.label || '');
            const cls = isRoot ? 'mm-node mm-root' : 'mm-node';
            let html = `<div class="mb-3"><span class="${cls}">${label}</span></div>`;

            if (node.children && node.children.length) {
                html += '<div class="mm-branch">';
                node.children.forEach(child => {
                    html += `<div class="mb-2 flex items-start"><span class="mm-connector mt-3"></span><div>${buildTreeHTML(child, false)}</div></div>`;
                });
                html += '</div>';
            }
            return html;
        }

        /* ─── Export ─── */

        function exportPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            let y = 20;
            doc.setFontSize(18);
            doc.text('Alsalem Neural-Notes', 105, y, { align: 'center' });
            y += 14;

            mcqCards.forEach((card, idx) => {
                if (y > 260) { doc.addPage(); y = 20; }
                doc.setFontSize(12);
                doc.setFont(undefined, 'bold');
                doc.text(`Q${idx + 1}: ${card.question}`, 14, y, { maxWidth: 180 });
                const qLines = doc.splitTextToSize(`Q${idx + 1}: ${card.question}`, 180);
                y += qLines.length * 6 + 4;

                doc.setFont(undefined, 'normal');
                if (card.options) {
                    card.options.forEach((opt, i) => {
                        if (y > 275) { doc.addPage(); y = 20; }
                        const prefix = String.fromCharCode(65 + i);
                        const marker = opt === (card.correctAnswer || card.correct_answer) ? ' ✓' : '';
                        doc.text(`  ${prefix}. ${opt}${marker}`, 18, y, { maxWidth: 170 });
                        const oLines = doc.splitTextToSize(`  ${prefix}. ${opt}${marker}`, 170);
                        y += oLines.length * 6 + 2;
                    });
                } else if (card.answer) {
                    doc.text(`A: ${card.answer}`, 18, y, { maxWidth: 170 });
                    const aLines = doc.splitTextToSize(`A: ${card.answer}`, 170);
                    y += aLines.length * 6 + 2;
                }
                y += 8;
            });
            doc.save('NeuralNotes_Export.pdf');
            document.getElementById('export-menu').classList.remove('show');
        }

        function exportCSV() {
            let csv = '';
            mcqCards.forEach(card => {
                const q = `"${(card.question || '').replace(/"/g, '""')}"`;
                let a;
                if (card.answer) {
                    a = `"${card.answer.replace(/"/g, '""')}"`;
                } else {
                    const correct = card.correctAnswer || card.correct_answer || '';
                    const opts = (card.options || []).map(o => `${o === correct ? '✓ ' : ''}${o}`).join(' | ');
                    a = `"${opts.replace(/"/g, '""')}"`;
                }
                csv += `${q},${a}\n`;
            });
            const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'NeuralNotes_Anki.csv';
            link.click();
            URL.revokeObjectURL(url);
            document.getElementById('export-menu').classList.remove('show');
        }

        /* ─── Utilities ─── */

        function escapeHtml(s) {
            const div = document.createElement('div');
            div.textContent = s || '';
            return div.innerHTML;
        }

        function escapeJS(s) {
            return String(s || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/\n/g, ' ');
        }
    </script>
</body>
</html>
